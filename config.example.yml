configVersion: 5
debugMode: false
suppressSessionUpdateMessage: false

http:
  proxy: ""

session:
  updateInterval: 30
  signalingMode: websocket
  queryServer: true
  webQueryFallback: false
  # false keeps the last successful query result when a query fails;
  # true resets the displayed values back to sessionInfo instead.
  configFallback: false
  broadcastSetting: 3
  worldType: Survival
  # Set both to 0 to use the operating system's full ephemeral UDP range.
  icePortRange:
    min: 0
    max: 0
  sessionInfo:
    hostName: Minecraft Server
    worldName: Minecraft World
    players: 0
    maxPlayers: 20
    ip: play.example.net
    port: 19132

friendSync:
  updateInterval: 60
  autoFollow: true
  autoUnfollow: true
  initialInvite: true
  # Keeps room on the friend list (Xbox allows 1000). 0 turns a rule off.
  cleanup:
    # Remove friends not seen for this many days.
    inactiveDays: 15
    # Keep friends plus pending requests at or below this, removing the least
    # recently seen friends first.
    maxFriends: 950
    # Seconds between inactive-friend checks.
    interval: 1800
    historyPath: cache/player_history.json

notifications:
  enabled: false
  webhookUrl: ""

gallery:
  enabled: true
  imagePath: screenshot.jpg
  deleteOtherImages: true

# Keep joined players inside the NetherNet session and relay their traffic to
# sessionInfo.ip:port instead of transferring them. Players stay session
# members while they play, so their friends can discover the world too. The
# backend must trust this relay's unsigned login chain (see README).
relay:
  enabled: false

accounts:
  primaryCachePath: cache/live_token.json
  subAccounts: []
