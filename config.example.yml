configVersion: 5
debugMode: false
suppressSessionUpdateMessage: false

http:
  proxy: ""

session:
  # Base URL of the server's NetherNet HTTP signaling. Joins are relayed to
  # {joinUrl}/v1/join and status queries read the same endpoint.
  joinUrl: https://play.example.net:19132
  updateInterval: 30
  signalingMode: websocket
  queryServer: true
  webQueryFallback: false
  # false keeps the last successful query result when a query fails;
  # true resets the displayed values back to sessionInfo instead.
  configFallback: false
  broadcastSetting: 3
  worldType: Survival
  # When a session fills up, a new one is published and the old one is kept.
  # true makes the old session invite-only after 30 seconds, so its members
  # stop showing the world to their friends.
  hideOldSessions: true
  sessionInfo:
    hostName: Minecraft Server
    worldName: Minecraft World
    players: 0
    maxPlayers: 20
    # Set both to advertise a version/protocol pair other than 1.26.60/2225.
    # version: 1.26.60
    # protocol: 2225

friendSync:
  updateInterval: 60
  autoFriend: true
  initialInvite: true
  expiry:
    enabled: true
    days: 15
    check: 1800
    historyPath: cache/player_history.json

notifications:
  enabled: false
  webhookUrl: ""

gallery:
  enabled: true
  imagePath: screenshot.jpg
  deleteOtherImages: true

accounts:
  primaryCachePath: cache/live_token.json
  subAccounts: []

metrics:
  listen: ""
